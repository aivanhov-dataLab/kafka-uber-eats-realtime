name: CI - Uber Eats Kafka

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
          
      - name: Lint - check only critical errors
        run: |
          # On bloque seulement les erreurs qui cassent l'app (pas le style)
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Docker Build Check
        run: |
          docker build -t ubers-eat-kafka:ci .

      - name: Check app import
        run: |
          python -c "from app.main import app; print('App imports OK')"